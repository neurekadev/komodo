name: CI

on:
  push:
    branches: [main]
    tags: ["*.*.*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  release-context:
    name: Release Context
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      is_release: ${{ steps.context.outputs.is_release }}
      source_version: ${{ steps.context.outputs.source_version }}
      version: ${{ steps.context.outputs.version }}
      is_prerelease: ${{ steps.context.outputs.is_prerelease }}
      upstream_version: ${{ steps.context.outputs.upstream_version }}
      upstream_major: ${{ steps.context.outputs.upstream_major }}
      upstream_minor: ${{ steps.context.outputs.upstream_minor }}
      is_fork: ${{ steps.context.outputs.is_fork }}
      fork_revision: ${{ steps.context.outputs.fork_revision }}
      container_compatible: ${{ steps.context.outputs.container_compatible }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve release context
        id: context
        env:
          CANDIDATE: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "push" || "$REF_TYPE" != "tag" ]]; then
            {
              echo "is_release=false"
              echo "source_version=edge"
              echo "version=edge"
              echo "is_prerelease=false"
              echo "upstream_version="
              echo "upstream_major="
              echo "upstream_minor="
              echo "is_fork=false"
              echo "fork_revision="
              echo "container_compatible=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          fork_re='^((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))\+neureka\.([1-9][0-9]*)$'

          if [[ ! "$CANDIDATE" =~ $semver_re ]]; then
            echo "Release tag must be complete bare SemVer: $CANDIDATE" >&2
            exit 1
          fi
          if [[ ! "$CANDIDATE" =~ $fork_re ]]; then
            echo "Release tag must use X.Y.Z+neureka.N fork versioning: $CANDIDATE" >&2
            exit 1
          fi

          upstream_version="${BASH_REMATCH[1]}"
          upstream_major="${BASH_REMATCH[2]}"
          upstream_minor="${BASH_REMATCH[3]}"
          fork_revision="${BASH_REMATCH[5]}"
          heading_prefix="## [$CANDIDATE] - "
          mapfile -t headings < <(grep -n -F "$heading_prefix" CHANGELOG.md || true)

          if [[ "${#headings[@]}" -ne 1 ]]; then
            echo "Expected exactly one changelog heading for $CANDIDATE" >&2
            exit 1
          fi

          heading_line="${headings[0]%%:*}"
          heading_text="${headings[0]#*:}"
          release_date="${heading_text#"$heading_prefix"}"
          if [[ ! "$release_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Release heading must end with an ISO date: $heading_text" >&2
            exit 1
          fi

          notes_file="$RUNNER_TEMP/release-notes.md"
          awk -v start="$heading_line" '
            NR <= start { next }
            /^## \[/ { exit }
            { print }
          ' CHANGELOG.md > "$notes_file"

          if ! grep -q '[^[:space:]]' "$notes_file"; then
            echo "Release notes for $CANDIDATE are empty" >&2
            exit 1
          fi
          if grep -Fq '[YANKED]' "$notes_file"; then
            echo "Release notes for $CANDIDATE are yanked" >&2
            exit 1
          fi

          first_note="$(awk 'NF { print; exit }' "$notes_file")"
          expected_upstream="Upstream: [$upstream_version release notes](https://github.com/moghtech/komodo/releases/tag/v$upstream_version)"
          if [[ "$first_note" != "$expected_upstream" ]]; then
            echo "First release note must be: $expected_upstream" >&2
            exit 1
          fi

          {
            echo "is_release=true"
            echo "source_version=$CANDIDATE"
            echo "version=$CANDIDATE"
            echo "is_prerelease=false"
            echo "upstream_version=$upstream_version"
            echo "upstream_major=$upstream_major"
            echo "upstream_minor=$upstream_minor"
            echo "is_fork=true"
            echo "fork_revision=$fork_revision"
            echo "container_compatible=true"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      # - name: Cache cargo registry
      #   uses: actions/cache@v4
      #   with:
      #     path: |
      #       ~/.cargo/registry
      #       ~/.cargo/git
      #       target
      #     key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      #     restore-keys: |
      #       ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  verify-container:
    name: Verify ${{ matrix.name }} Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Core
            dockerfile: bin/core/aio.Dockerfile
          - name: Periphery
            dockerfile: bin/periphery/aio.Dockerfile
          - name: CLI
            dockerfile: bin/cli/aio.Dockerfile

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Verify image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          sbom: false

  publish-image:
    name: Publish ${{ matrix.name }} Image
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
      (github.ref_type == 'tag' &&
      needs.release-context.outputs.is_release == 'true' &&
      needs.release-context.outputs.container_compatible == 'true'))
    needs: [release-context, build, fmt, verify-container]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Core
            image: core
            dockerfile: bin/core/aio.Dockerfile
            description: Komodo Core
          - name: Periphery
            image: periphery
            dockerfile: bin/periphery/aio.Dockerfile
            description: Komodo Periphery
          - name: CLI
            image: cli
            dockerfile: bin/cli/aio.Dockerfile
            description: Komodo CLI

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository_owner }}/komodo-${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ needs.release-context.outputs.upstream_version }},enable=${{ needs.release-context.outputs.is_release == 'true' }}
            type=raw,value=${{ needs.release-context.outputs.upstream_major }}.${{ needs.release-context.outputs.upstream_minor }},enable=${{ needs.release-context.outputs.is_release == 'true' }}
            type=raw,value=${{ needs.release-context.outputs.upstream_major }},enable=${{ needs.release-context.outputs.is_release == 'true' }}
            type=raw,value=latest,enable=${{ needs.release-context.outputs.is_release == 'true' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=GPL-3.0-or-later
            org.opencontainers.image.version=${{ needs.release-context.outputs.source_version }}
          annotations: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=GPL-3.0-or-later
            org.opencontainers.image.version=${{ needs.release-context.outputs.source_version }}

      - name: Build and publish image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          provenance: mode=max
          sbom: true

  release:
    name: Create GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [publish-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Extract release notes
        run: |
          set -euo pipefail

          fork_re='^((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))\+neureka\.([1-9][0-9]*)$'
          if [[ ! "$TAG" =~ $fork_re ]]; then
            echo "Release tag must use X.Y.Z+neureka.N fork versioning: $TAG" >&2
            exit 1
          fi

          upstream_version="${BASH_REMATCH[1]}"
          heading_prefix="## [$TAG] - "
          mapfile -t headings < <(grep -n -F "$heading_prefix" CHANGELOG.md || true)
          if [[ "${#headings[@]}" -ne 1 ]]; then
            echo "Expected exactly one changelog heading for $TAG" >&2
            exit 1
          fi

          heading_line="${headings[0]%%:*}"
          heading_text="${headings[0]#*:}"
          release_date="${heading_text#"$heading_prefix"}"
          if [[ ! "$release_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Release heading must end with an ISO date: $heading_text" >&2
            exit 1
          fi

          notes_file="$RUNNER_TEMP/release-notes.md"
          awk -v start="$heading_line" '
            NR <= start { next }
            /^## \[/ { exit }
            { print }
          ' CHANGELOG.md > "$notes_file"

          if ! grep -q '[^[:space:]]' "$notes_file"; then
            echo "Release notes for $TAG are empty" >&2
            exit 1
          fi
          if grep -Fq '[YANKED]' "$notes_file"; then
            echo "Release notes for $TAG are yanked" >&2
            exit 1
          fi

          first_note="$(awk 'NF { print; exit }' "$notes_file")"
          expected_upstream="Upstream: [$upstream_version release notes](https://github.com/moghtech/komodo/releases/tag/v$upstream_version)"
          if [[ "$first_note" != "$expected_upstream" ]]; then
            echo "First release note must be: $expected_upstream" >&2
            exit 1
          fi

      - name: Create GitHub release
        run: |
          set -euo pipefail

          api_error="$RUNNER_TEMP/release-api-error.txt"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>"$api_error"; then
            echo "GitHub release $TAG already exists; leaving it unchanged."
            exit 0
          fi

          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>>"$api_error"; then
            echo "GitHub release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          if ! grep -q 'HTTP 404' "$api_error"; then
            cat "$api_error" >&2
            exit 1
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --fail-on-no-commits \
            --latest \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
