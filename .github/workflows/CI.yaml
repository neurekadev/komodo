name: CI

on:
  push:
    branches: [main]
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Restore Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
          cache-bin: false

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false

      - name: Run Unit Tests
        run: cargo test --lib --bins

  build:
    name: Build
    permissions:
      contents: read
    uses: ./.github/workflows/BuildImages.yaml

  publish-platforms:
    name: Publish ${{ matrix.name }}
    if: >-
      (github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref_type == 'tag')) ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    needs:
      - lint
      - unit-tests
      - build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Core AMD64
            component: core
            description: Komodo Core
            context: .
            dockerfile: bin/core/single-arch.Dockerfile
            arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - name: Core ARM64
            component: core
            description: Komodo Core
            context: .
            dockerfile: bin/core/single-arch.Dockerfile
            arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - name: Periphery AMD64
            component: periphery
            description: Komodo Periphery
            context: .
            dockerfile: bin/periphery/single-arch.Dockerfile
            arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - name: Periphery ARM64
            component: periphery
            description: Komodo Periphery
            context: .
            dockerfile: bin/periphery/single-arch.Dockerfile
            arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - name: CLI AMD64
            component: cli
            description: Komodo CLI
            context: .
            dockerfile: bin/cli/single-arch.Dockerfile
            arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - name: CLI ARM64
            component: cli
            description: Komodo CLI
            context: .
            dockerfile: bin/cli/single-arch.Dockerfile
            arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    env:
      CACHE_PREFIX: ${{ github.event_name == 'pull_request' && 'ci' || 'publish' }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/komodo-${{ matrix.component }}
      SOURCE_VERSION: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.ref_type == 'tag' && github.ref_name || 'edge') }}

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download Binaries
        uses: actions/download-artifact@v8
        with:
          name: build-binaries-${{ matrix.arch }}
          path: ${{ runner.temp }}/binaries

      - name: Download UI
        uses: actions/download-artifact@v8
        with:
          name: build-ui
          path: ${{ runner.temp }}/ui

      - name: Prepare Binaries Context
        id: binaries
        run: |
          set -euo pipefail
          digest="$(< "$RUNNER_TEMP/binaries/digest")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Downloaded an invalid binaries digest: $digest" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/binaries-layout"
          tar -xf "$RUNNER_TEMP/binaries/binaries.oci.tar" -C "$RUNNER_TEMP/binaries-layout"
          jq -e --arg digest "$digest" '.manifests[] | select(.digest == $digest)' \
            "$RUNNER_TEMP/binaries-layout/index.json" >/dev/null
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log In to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract Image Metadata
        id: metadata
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=GPL-3.0-or-later
            org.opencontainers.image.version=${{ env.SOURCE_VERSION }}
          annotations: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=GPL-3.0-or-later
            org.opencontainers.image.version=${{ env.SOURCE_VERSION }}

      - name: Build and Publish Platform Image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          provenance: mode=max
          sbom: true
          build-contexts: |
            binaries=oci-layout://${{ runner.temp }}/binaries-layout@${{ steps.binaries.outputs.digest }}
            ui=${{ runner.temp }}/ui
          build-args: |
            BINARIES_IMAGE=binaries
            UI_IMAGE=ui
            GIT_TAG=${{ env.SOURCE_VERSION }}
            GIT_HASH=${{ github.sha }}
          cache-from: type=gha,scope=${{ env.CACHE_PREFIX }}-${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ env.CACHE_PREFIX }}-${{ matrix.component }}-${{ matrix.arch }},mode=max,ignore-error=true

      - name: Export Digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Build produced an invalid digest: $DIGEST" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload Digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.component }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.name }}
    if: >-
      (github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref_type == 'tag')) ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    needs:
      - publish-platforms
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Core
            component: core
            description: Komodo Core
          - name: Periphery
            component: periphery
            description: Komodo Periphery
          - name: CLI
            component: cli
            description: Komodo CLI
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/komodo-${{ matrix.component }}
      SOURCE_VERSION: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.ref_type == 'tag' && github.ref_name || 'edge') }}

    steps:
      - name: Download Digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-${{ matrix.component }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Log In to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Image Metadata
        id: metadata
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto
          tags: |
            type=ref,event=pr
            type=edge
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=GPL-3.0-or-later
            org.opencontainers.image.version=${{ env.SOURCE_VERSION }}
          annotations: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=GPL-3.0-or-later
            org.opencontainers.image.version=${{ env.SOURCE_VERSION }}

      - name: Create Multi-Platform Manifest
        env:
          DIGESTS: ${{ runner.temp }}/digests
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          set -euo pipefail
          mapfile -t digest_files < <(find "$DIGESTS" -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "${#digest_files[@]}" -ne 2 ]]; then
            echo "Expected two platform digests, found ${#digest_files[@]}." >&2
            exit 1
          fi

          sources=()
          for digest in "${digest_files[@]}"; do
            if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Invalid digest filename: $digest" >&2
              exit 1
            fi
            sources+=("$IMAGE@sha256:$digest")
          done

          tag_args=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              tag_args+=(--tag "$tag")
            fi
          done <<< "$TAGS"
          if [[ "${#tag_args[@]}" -eq 0 ]]; then
            echo "No image tags were generated for $SOURCE_VERSION." >&2
            exit 1
          fi

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

      - name: Verify Multi-Platform Manifest
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "$VERSION" ]]; then
            echo "Image metadata did not produce a version." >&2
            exit 1
          fi
          manifest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --raw)"
          jq -e 'any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64")' <<< "$manifest"
          jq -e 'any(.manifests[]; .platform.os == "linux" and .platform.architecture == "arm64")' <<< "$manifest"

  release:
    name: Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - lint
      - unit-tests
      - build
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check Out Repository History
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create Release
        uses: neurekadev/create-release-action@2
        with:
          github-token: ${{ github.token }}
          api-key: ${{ secrets.INFERENCE_API_KEY }}
          base-url: https://api.openai.com/v1
          model: gpt-5-mini
          reasoning-effort: low
