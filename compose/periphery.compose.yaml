# Additional server: save periphery.env as .env.
# Run with -p komodo to retain the established komodo_data volume.
services:
  komodo-periphery:
    image: ghcr.io/neurekadev/komodo-periphery:${COMPOSE_KOMODO_IMAGE_TAG:-3}
    container_name: komodo-periphery
    env_file: [.env]
    networks: [komodo-periphery]
    volumes:
      # Persist Periphery state and its Vykar cache at host-visible Docker paths.
      - data:/data
      # Docker socket and volume access give Periphery control of this host.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PERIPHERY_DOCKER_VOLUME_ROOT:-/var/lib/docker/volumes}:${PERIPHERY_DOCKER_VOLUME_ROOT:-/var/lib/docker/volumes}
      - /proc:/proc
      # Optional: mount custom configuration or a trusted root CA.
      # - /path/to/periphery.config.toml:/config/config.toml:ro
      # - /path/to/root_ca.crt:/usr/local/share/ca-certificates/root_ca.crt:ro
    restart: unless-stopped
    init: true
    command: [periphery-compose]

networks:
  komodo-periphery:
    name: komodo-periphery

volumes:
  data:
