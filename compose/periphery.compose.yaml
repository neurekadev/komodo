####################################
# 🦎 KOMODO COMPOSE - PERIPHERY 🦎 #
####################################

## This compose file will deploy:
##   1. Komodo Periphery

services:
  periphery:
    image: ghcr.io/neurekadev/komodo-periphery:${COMPOSE_KOMODO_IMAGE_TAG:-3}
    container_name: komodo-periphery
    init: true
    restart: unless-stopped
    ## Full variable list + descriptions are available here:
    ## 🦎 https://github.com/neurekadev/komodo/blob/main/config/periphery.config.toml 🦎
    environment:
      ## The address of Komodo Core to connect to.
      PERIPHERY_CORE_ADDRESS: ${PERIPHERY_CORE_ADDRESS}
      ## The name of the Komodo Server to connect as.
      ## Must match existing server.
      PERIPHERY_CONNECT_AS: ${PERIPHERY_CONNECT_AS}
      ## Optional. Create a Server Onboarding Key in the Komodo UI.
      ## This allows Periphery to create a new Server in the UI with the above name,
      ## and can be omitted once the Server exists in Komodo.
      PERIPHERY_ONBOARDING_KEY: ${PERIPHERY_ONBOARDING_KEY:-}
      ## Persist the private key in the shared data volume.
      PERIPHERY_PRIVATE_KEY: ${PERIPHERY_PRIVATE_KEY:-file:/data/keys/periphery.key}
      ## List of accepted Core public keys.
      ## File will be auto written if doesn't exist to match first Core it connects to.
      PERIPHERY_CORE_PUBLIC_KEYS: ${PERIPHERY_CORE_PUBLIC_KEYS:-file:/data/keys/core.pub}
      ## Specify the root directory used by Periphery agent.
      ## Persistent keys, SSL files, and File Manager state remain here.
      PERIPHERY_ROOT_DIRECTORY: ${PERIPHERY_ROOT_DIRECTORY:-/data}
      ## Keep Docker-managed workspaces in the host daemon's path namespace.
      ## These paths are aliases of the same data volume mounted at /data.
      PERIPHERY_REPO_DIR: ${PERIPHERY_REPO_DIR:-${PERIPHERY_DOCKER_VOLUME_ROOT:-/var/lib/docker/volumes}/${COMPOSE_PROJECT_NAME:-komodo}_data/_data/repos}
      PERIPHERY_STACK_DIR: ${PERIPHERY_STACK_DIR:-${PERIPHERY_DOCKER_VOLUME_ROOT:-/var/lib/docker/volumes}/${COMPOSE_PROJECT_NAME:-komodo}_data/_data/stacks}
      PERIPHERY_BUILD_DIR: ${PERIPHERY_BUILD_DIR:-${PERIPHERY_DOCKER_VOLUME_ROOT:-/var/lib/docker/volumes}/${COMPOSE_PROJECT_NAME:-komodo}_data/_data/builds}
      ## Specify whether to disable the terminals feature
      ## and disallow remote shell access (inside the Periphery container).
      PERIPHERY_DISABLE_TERMINALS: ${PERIPHERY_DISABLE_TERMINALS:-false}
      ## Specify whether to disable the container exec feature
      ## and disallow remote container shell access.
      PERIPHERY_DISABLE_CONTAINER_TERMINALS: ${PERIPHERY_DISABLE_CONTAINER_TERMINALS:-false}
      ## If the disk size is overreporting, can use one of these to 
      ## whitelist / blacklist the disks to filter them, whichever is easier.
      ## Accepts comma separated list of paths.
      ## Usually whitelisting just /etc/hostname gives correct size for single root disk.
      PERIPHERY_INCLUDE_DISK_MOUNTS: ${PERIPHERY_INCLUDE_DISK_MOUNTS:-/etc/hostname}
      # PERIPHERY_EXCLUDE_DISK_MOUNTS: ${PERIPHERY_EXCLUDE_DISK_MOUNTS:-/snap,/etc/repos}
    volumes:
      ## Persist keys and all Periphery-managed state, including its Vykar cache.
      - data:/data
      ## Mount external docker socket
      - /var/run/docker.sock:/var/run/docker.sock
      ## Allow the File Manager to access local Docker named volumes.
      ## Keep Docker's absolute host volume root identical inside the container.
      ## Set this to Docker's absolute volume root when using a nonstandard data root.
      ## Security: This intentionally grants Periphery read/write access to every
      ## local named volume. Restrict Server FileManager permission accordingly;
      ## the File Manager rejects Periphery's own protected data volume.
      - ${PERIPHERY_DOCKER_VOLUME_ROOT:-/var/lib/docker/volumes}:${PERIPHERY_DOCKER_VOLUME_ROOT:-/var/lib/docker/volumes}
      ## Allow Periphery to see processes outside of container
      - /proc:/proc
      ## Optionally mount a custom periphery.config.toml
      # - /path/to/periphery.config.toml:/config/config.toml
      ## Optionally mount custom root CA certificate to trust
      # - /path/to/root_ca.crt:/usr/local/share/ca-certificates/root_ca.crt

volumes:
  data:
