# Main installation: MongoDB, Core, and local Periphery.
# Save compose.env as .env and run: docker compose -p komodo up -d

services:
  komodo:
    image: ghcr.io/neurekadev/komodo-core:${COMPOSE_KOMODO_IMAGE_TAG:-3}
    container_name: komodo
    depends_on: [komodo-mongo]
    env_file: [.env]
    networks:
      komodo:
        aliases: [core, komodo-core]
    ports:
      - "9120:9120"
    volumes:
      # Keys, backups, syncs, and repository cache stay in the existing volume.
      - data:/data
      # Optional: mount custom configuration or a trusted root CA.
      # - /path/to/core.config.toml:/config/config.toml:ro
      # - /path/to/root_ca.crt:/usr/local/share/ca-certificates/root_ca.crt:ro
    restart: unless-stopped
    init: true
    command: [core-compose]

  komodo-mongo:
    image: mongo:8
    container_name: komodo-mongo
    env_file: [.env]
    networks:
      komodo:
        aliases: [mongo, komodo-database]
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    restart: unless-stopped
    command: --quiet --wiredTigerCacheSizeGB 0.25
    labels:
      komodo.skip: "true" # Keep Komodo from stopping its own database.

  komodo-periphery:
    image: ghcr.io/neurekadev/komodo-periphery:${COMPOSE_KOMODO_IMAGE_TAG:-3}
    container_name: komodo-periphery
    depends_on: [komodo]
    env_file: [.env]
    networks:
      komodo:
        aliases: [periphery]
    volumes:
      # Keep the established shared data volume and host-visible Docker paths.
      - data:/data
      # Docker socket and volume access give Periphery control of this host.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PERIPHERY_DOCKER_VOLUME_ROOT:-/var/lib/docker/volumes}:${PERIPHERY_DOCKER_VOLUME_ROOT:-/var/lib/docker/volumes}
      - /proc:/proc
      # Optional: mount custom configuration or a trusted root CA.
      # - /path/to/periphery.config.toml:/config/config.toml:ro
      # - /path/to/root_ca.crt:/usr/local/share/ca-certificates/root_ca.crt:ro
    restart: unless-stopped
    init: true
    command: [periphery-compose]

networks:
  komodo:
    name: komodo

volumes:
  mongo-data:
  mongo-config:
  data:
