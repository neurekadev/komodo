# Alternative Komodo installation for hosts that use FerretDB.
# Starts PostgreSQL, FerretDB, Core, and a local Periphery agent.

services:
  postgres:
    # Pin this image before production use; database upgrades can be breaking.
    image: ghcr.io/ferretdb/postgres-documentdb
    container_name: komodo-postgres
    restart: unless-stopped
    labels:
      komodo.skip: # Keep Komodo from stopping its own database.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${KOMODO_DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
      POSTGRES_DB: postgres

  ferretdb:
    # Pin this image before production use; database upgrades can be breaking.
    image: ghcr.io/ferretdb/ferretdb
    container_name: komodo-ferretdb
    restart: unless-stopped
    depends_on:
      - postgres
    labels:
      komodo.skip: # Keep Komodo from stopping its own database.
    volumes:
      - ferretdb-state:/state
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://${KOMODO_DATABASE_USERNAME}:${KOMODO_DATABASE_PASSWORD}@postgres:5432/postgres

  core:
    image: ghcr.io/neurekadev/komodo-core:${COMPOSE_KOMODO_IMAGE_TAG:-3}
    container_name: komodo-core
    init: true
    restart: unless-stopped
    depends_on:
      - ferretdb
    ports:
      - 9120:9120
    env_file: ./.env
    environment:
      KOMODO_DATABASE_ADDRESS: ferretdb:27017
      KOMODO_PRIVATE_KEY: ${KOMODO_PRIVATE_KEY:-file:/data/keys/core.key}
      KOMODO_REPORTING_PRIVATE_KEY: ${KOMODO_REPORTING_PRIVATE_KEY:-file:/data/keys/reporting.key}
      KOMODO_PERIPHERY_PUBLIC_KEY: ${KOMODO_PERIPHERY_PUBLIC_KEY:-file:/data/keys/periphery.pub}
      KOMODO_CLI_BACKUPS_FOLDER: ${KOMODO_CLI_BACKUPS_FOLDER:-/data/backups}
      KOMODO_SYNC_DIRECTORY: ${KOMODO_SYNC_DIRECTORY:-/data/syncs}
      KOMODO_REPO_DIRECTORY: ${KOMODO_REPO_DIRECTORY:-/data/repo-cache}
    volumes:
      # Shared application data and communication keys.
      - data:/data
      # Optional: mount a custom configuration file or trusted root CA.
      # - /path/to/core.config.toml:/config/config.toml
      # - /path/to/root_ca.crt:/usr/local/share/ca-certificates/root_ca.crt

  periphery:
    image: ghcr.io/neurekadev/komodo-periphery:${COMPOSE_KOMODO_IMAGE_TAG:-3}
    container_name: komodo-periphery
    init: true
    restart: unless-stopped
    depends_on:
      - core
    env_file: ./.env
    environment:
      # Connect this agent to the local Core and register it as the first Server.
      PERIPHERY_CORE_ADDRESS: ${PERIPHERY_CORE_ADDRESS-ws://core:9120}
      PERIPHERY_CONNECT_AS: ${PERIPHERY_CONNECT_AS:-${KOMODO_FIRST_SERVER_NAME:-Local}}
      PERIPHERY_PRIVATE_KEY: ${PERIPHERY_PRIVATE_KEY:-file:/data/keys/periphery.key}
      PERIPHERY_CORE_PUBLIC_KEYS: ${PERIPHERY_CORE_PUBLIC_KEYS:-file:/data/keys/core.pub}
      PERIPHERY_ROOT_DIRECTORY: ${PERIPHERY_ROOT_DIRECTORY:-/data}
      # Docker resolves Stack paths on the host, so use host-visible aliases.
      PERIPHERY_REPO_DIR: ${PERIPHERY_REPO_DIR:-${PERIPHERY_DOCKER_VOLUME_ROOT:-/var/lib/docker/volumes}/${COMPOSE_PROJECT_NAME:-komodo}_data/_data/repos}
      PERIPHERY_STACK_DIR: ${PERIPHERY_STACK_DIR:-${PERIPHERY_DOCKER_VOLUME_ROOT:-/var/lib/docker/volumes}/${COMPOSE_PROJECT_NAME:-komodo}_data/_data/stacks}
      PERIPHERY_BUILD_DIR: ${PERIPHERY_BUILD_DIR:-${PERIPHERY_DOCKER_VOLUME_ROOT:-/var/lib/docker/volumes}/${COMPOSE_PROJECT_NAME:-komodo}_data/_data/builds}
    volumes:
      - data:/data
      # Periphery controls the host through Docker. Treat it as host trusted.
      - /var/run/docker.sock:/var/run/docker.sock
      # Read/write access to all local named volumes for File Manager.
      # Restrict Server FileManager permissions to trusted users.
      - ${PERIPHERY_DOCKER_VOLUME_ROOT:-/var/lib/docker/volumes}:${PERIPHERY_DOCKER_VOLUME_ROOT:-/var/lib/docker/volumes}
      # Required for host process and disk statistics.
      - /proc:/proc
      # Optional: mount a custom configuration file or trusted root CA.
      # - /path/to/periphery.config.toml:/config/config.toml
      # - /path/to/root_ca.crt:/usr/local/share/ca-certificates/root_ca.crt

volumes:
  postgres-data:
  ferretdb-state:
  data:
