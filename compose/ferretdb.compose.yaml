# Alternative installation: PostgreSQL/DocumentDB, FerretDB, Core, and Periphery.
# Save ferretdb.env as .env and run: docker compose -p komodo up -d
# Back up existing databases and verify the PostgreSQL major before upgrading.

services:
  komodo:
    image: ghcr.io/neurekadev/komodo-core:${COMPOSE_KOMODO_IMAGE_TAG:-3}
    container_name: komodo
    depends_on: [komodo-ferretdb]
    env_file: [.env]
    networks:
      komodo:
        aliases: [core, komodo-core]
    ports:
      - "9120:9120"
    volumes:
      # Communication keys, working data, and cache remain shared.
      - data:/data
      # The repository is Core-only; workers use the authenticated endpoint.
      - backups:/backups
      # Backup authentication and sealing material must remain Core-only.
      - core-secrets:/core-secrets
      # Optional: mount custom configuration or a trusted root CA.
      # - /path/to/core.config.toml:/config/config.toml:ro
      # - /path/to/root_ca.crt:/usr/local/share/ca-certificates/root_ca.crt:ro
    restart: unless-stopped
    init: true
    command: [core-compose]

  komodo-postgres:
    image: ghcr.io/ferretdb/postgres-documentdb:17
    container_name: komodo-postgres
    env_file: [.env]
    networks:
      komodo:
        aliases: [postgres]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    labels:
      komodo.skip: "true"

  komodo-ferretdb:
    image: ghcr.io/ferretdb/ferretdb:2
    container_name: komodo-ferretdb
    depends_on: [komodo-postgres]
    env_file: [.env]
    networks:
      komodo:
        aliases: [ferretdb, komodo-database]
    volumes:
      - ferretdb-state:/state
    restart: unless-stopped
    labels:
      komodo.skip: "true"

  komodo-periphery:
    image: ghcr.io/neurekadev/komodo-periphery:${COMPOSE_KOMODO_IMAGE_TAG:-3}
    container_name: komodo-periphery
    depends_on: [komodo]
    env_file: [.env]
    networks:
      komodo:
        aliases: [periphery]
    volumes:
      # Persist Periphery state and its Vykar cache at host-visible Docker paths.
      - data:/data
      # Docker socket and volume access give Periphery control of this host.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PERIPHERY_DOCKER_VOLUME_ROOT:-/var/lib/docker/volumes}:${PERIPHERY_DOCKER_VOLUME_ROOT:-/var/lib/docker/volumes}
      - /proc:/proc
      # Optional: mount custom configuration or a trusted root CA.
      # - /path/to/periphery.config.toml:/config/config.toml:ro
      # - /path/to/root_ca.crt:/usr/local/share/ca-certificates/root_ca.crt:ro
    restart: unless-stopped
    init: true
    command: [periphery-compose]

networks:
  komodo:
    name: komodo

volumes:
  postgres-data:
  ferretdb-state:
  data:
  backups:
    labels:
      komodo.file-manager.excluded: "true"
  # Core-only backup authentication and sealing key
  core-secrets:
    labels:
      komodo.file-manager.excluded: "true"
